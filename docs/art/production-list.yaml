# -----------------------------------------------------------------
# Totals — v3.0 (auto-validated by validate-production-list.mjs)
#
#   characters: 10 archetypes × 8 dirs × (4 idle + 6 walk) = 10 × 80 = 800 frames
#               (all from existing PixelLab library; downloaded, not generated)
#   tiles:      15 PNG (8 floor/wall + 7 furniture)
#   effects:    6 PNG (some animated, accounted in atlas pack)
#   icons:      4 PNG
#   foundation: 3 (palette + style reference + iso-grid-reference)
#
#   PixelLab API calls (V1, deterministic; cached on re-run with same seed):
#     - characters: 0 calls (status="external-library"; pulled by
#                   download-pixellab-character.mjs from existing library)
#     - tiles:      15 calls (one create_object per tile, directions=1, all
#                   citing iso-grid-reference.png to lock 30°/45° iso angle)
#     - effects:    6 calls
#     - foundation: 3-5 calls (style-reference iterations; palette and
#                   iso-grid-reference are generator-based, 0 PixelLab calls)
#     - icons:      0 calls (rasterised from lucide SVG, not PixelLab)
#
#   Total V1 PixelLab calls: ~24-26 (down from v2.0's ~94 because all
#   characters now reuse external library — biggest cost-saving of v3.0).
# -----------------------------------------------------------------
