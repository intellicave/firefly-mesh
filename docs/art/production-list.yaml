# -----------------------------------------------------------------
# 3 — TILES (15 modular pieces; v3.0 tile-based composition)
#
#     V3.0 abandons integral 256×192 room PNGs. The whole office floor
#     is composed at runtime by Phaser from these 15 tile primitives,
#     driven by floor-plan.yaml (see art-bible §4.2).
#
#     ALL tiles MUST use identical PixelLab parameters:
#       - view: "high top-down" (true iso 30°/45°)
#       - reference_image: docs/art/iso-grid-reference.png
#       - directions: 1   (no rotation; all tiles render in fixed orientation)
#       - 32-color palette locked
#
#     This eliminates the v2.0 angle-drift problem (some rooms 30° dimetric,
#     some 45° high-down) by forcing every tile through the same prompt
#     geometry. QA gate HR12 (iso-angle Hough check) verifies edges land
#     within ±2° of canonical 30°.
# -----------------------------------------------------------------
tiles:

  # --- Floor tiles (rhombus base, 64×32, anchor bottom-centre 32,32) ---

  - id: "tile/floor-office"
    type: "floor"
    description: "Wood-textured isometric rhombus floor tile, warm brown ramp 1 mid (#8a6a4a). Used inside office rooms (CEO Office, Product Maker, Sales Bullpen, Floor Flex)."
    size: { w: 64, h: 32 }
    anchor: { x: 32, y: 32 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/floor-hallway"
    type: "floor"
    description: "Polished light-tile isometric rhombus, neutral ramp 0 light. Connects rooms across the central hallway."
    size: { w: 64, h: 32 }
    anchor: { x: 32, y: 32 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  # --- Wall tiles (3 floor-heights tall, anchored at base) ---

  - id: "tile/wall-back"
    type: "wall"
    description: "North-facing back wall section, light beige with single decoration slot at row 32 (used by bulletin/whiteboard `attached: back` furniture). 3 floor-heights tall."
    size: { w: 64, h: 96 }
    anchor: { x: 32, y: 96 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/wall-side-W"
    type: "wall"
    description: "West side wall section, half-width (perspective foreshortening at iso 30°/45°). Lit from upper-right."
    size: { w: 32, h: 96 }
    anchor: { x: 32, y: 96 }                     # bottom-right
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/wall-side-E"
    type: "wall"
    description: "East side wall section, half-width. NOT a mirror of W — lighting/highlight asymmetry forbids HR6 mirror trick on walls (HR6 mirror trick was repealed for chars only)."
    size: { w: 32, h: 96 }
    anchor: { x: 0, y: 96 }                      # bottom-left
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/wall-corner-NW"
    type: "wall"
    description: "Corner where N and W walls meet, light beige."
    size: { w: 64, h: 96 }
    anchor: { x: 32, y: 96 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/wall-corner-NE"
    type: "wall"
    description: "Corner where N and E walls meet, light beige."
    size: { w: 64, h: 96 }
    anchor: { x: 32, y: 96 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  - id: "tile/doorway-S"
    type: "wall"
    description: "Archway in south wall — character can pass through. Optional door sprite (animated open/close) hangs in front in V0.2."
    size: { w: 64, h: 96 }
    anchor: { x: 32, y: 96 }
    depends_on: ["foundation/iso-grid-reference", "foundation/palette-png"]
    pixellab:
      method: "create_object"
      view: "high top-down"
      directions: 1
      reference_image: "docs/art/iso-grid-reference.png"
    status: "queued"

  # --- Furniture tiles (floor-attached unless noted; participate in y-sort) ---

  - id: "furn/desk-CEO"
    type: "furniture"
