  # --- Furniture (all under tile/ prefix to match engine AssetRegistry key space) ---

  - id: "tile/desk-ceo"
    type: "furniture"
    description: "Executive L-shaped dark walnut desk with monitor, laptop, nameplate."
    size: { w: 64, h: 64 }
    anchor: { x: 32, y: 64 }
