# -----------------------------------------------------------------
# 3 — TILES (15 modular pieces; v3.0 tile-based composition)
#
#     V3.0 abandons integral 256×192 room PNGs. The whole office floor
#     is composed at runtime by Phaser from these 15 tile primitives,
#     driven by floor-plan.yaml (see art-bible §4.2).
#
#     ALL tiles MUST use identical PixelLab parameters:
#       - view: "high top-down" (true iso 30°/45°)
#       - reference_image: docs/art/iso-grid-reference.png
#       - directions: 1   (no rotation; all tiles render in fixed orientation)
#       - 32-color palette locked
#
#     This eliminates the v2.0 angle-drift problem (some rooms 30° dimetric,
#     some 45° high-down) by forcing every tile through the same prompt
#     geometry. QA gate HR12 (iso-angle Hough check) verifies edges land
#     within ±2° of canonical 30°.
# -----------------------------------------------------------------
tiles:

  # --- Floor tiles (64×64 px as generated by PixelLab tiles_pro, Phase 2) ---

  - id: "tile/floor-office"
    type: "floor"
    description: "Warm wood parquet isometric floor tile (oak grain, polished, warm brown). Used inside office rooms."
    size: { w: 64, h: 64 }
    anchor: { x: 32, y: 32 }
    status: "shipped"

  - id: "tile/floor-hallway"
    type: "floor"
    description: "Polished light stone corridor floor tile (cool neutral gray-white, smooth). Connects rooms across the central hallway."
    size: { w: 64, h: 64 }
    anchor: { x: 32, y: 32 }
    status: "shipped"

  # --- Wall tiles (generated via create_map_object view:high-top-down, Phase 2) ---

  - id: "tile/wall-back"
    type: "wall"
    description: "North-facing back wall section, dark charcoal with baseboard trim."
    size: { w: 64, h: 64 }
    anchor: { x: 32, y: 64 }
    status: "shipped"

  - id: "tile/wall-side-w"
    type: "wall"
    description: "West side wall section, narrow vertical panel, dark gray."
    size: { w: 32, h: 32 }
    anchor: { x: 32, y: 32 }
    status: "shipped"

  - id: "tile/wall-side-e"
    type: "wall"
    description: "East side wall section, narrow vertical panel, dark gray."
    size: { w: 32, h: 32 }
    anchor: { x: 0, y: 32 }
    status: "shipped"

  - id: "tile/wall-corner-nw"
    type: "wall"
    description: "Corner where north and west walls meet."
    size: { w: 32, h: 32 }
    anchor: { x: 32, y: 32 }
    status: "shipped"

  - id: "tile/wall-corner-ne"
    type: "wall"
    description: "Corner where north and east walls meet."
    size: { w: 32, h: 32 }
    anchor: { x: 32, y: 32 }
    status: "shipped"

  - id: "tile/wall-doorway-s"
    type: "wall"
    description: "Open doorway in south-facing wall — character passage point."
    size: { w: 64, h: 64 }
    anchor: { x: 32, y: 64 }
