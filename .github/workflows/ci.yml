name: CI

on:
  pull_request:
  push:
    branches: [main, edge]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages + services)
        run: pnpm -r typecheck

      - name: Build hub (wrangler dry-run)
        run: pnpm --filter @firefly-mesh/hub exec wrangler deploy --dry-run
        continue-on-error: true
