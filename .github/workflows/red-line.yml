name: Red-line

# Enforces firefly-mesh edge quality red-lines (rules.md §1 + §2).
# Any hit fails the PR — no exceptions, no "for now".

on:
  pull_request:
  push:
    branches: [main, edge]

jobs:
  red-line:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # R1: Ban TODO/FIXME/HACK/XXX marker comments in source code.
      # Note: 'placeholder' (HTML form attribute, Tailwind class) and 'stub'
      # (Cloudflare Durable Object API term) are intentionally excluded —
      # they have legitimate non-placeholder uses. Real placeholder code is
      # caught by the dedicated checks below (R1 not-implemented, R2 mock files).
      - name: R1 Forbidden marker comments
        run: |
          ! grep -rn -E '\b(TODO|FIXME|HACK|XXX)\b' \
            packages/ services/ \
            --include='*.ts' --include='*.tsx' \
            | grep -v -E '(\.test\.|__tests__|\.spec\.)'

      # R1: Ban throw new Error('not implemented')
      - name: R1 Ban not-implemented errors (use AppError with ErrorCode)
        run: |
          ! grep -rn "throw new Error('not implemented')" \
            packages/ services/ --include='*.ts'

      # R2: Ban mock/fake/dummy files outside test directories
      - name: R2 Ban mock/fake/dummy non-test files
        run: |
          ! find packages/ services/ -name '*.ts' -not -path '*/__tests__/*' \
            -not -name '*.test.ts' -not -name '*.spec.ts' \
            | xargs grep -l -E '(mock|fake|dummy)' 2>/dev/null \
            | grep -E '(mock|fake|dummy)\.(ts|tsx)$'

      # R3: Downgrade signal words
      - name: R3 Ban downgrade signal words
        run: |
          ! grep -rn -E '(for now|暂时|先用|简单起见|to be replaced|will integrate later|简化版|简易版)' \
            packages/ services/ \
            --include='*.ts' --include='*.tsx' --include='*.md' \
            | grep -v -E '(legacy/|docs/)'

      # R6: Ban emoji in JSX/TSX text nodes (services/pwa)
      - name: R6 Ban emoji in JSX text nodes
        run: |
          if grep -rn -P '>(?:[^<]*[\x{1F000}-\x{1FFFF}\x{2600}-\x{27BF}])' \
              services/pwa/ --include='*.tsx' --include='*.astro' 2>/dev/null; then
            echo "::error::Emoji found in JSX/Astro text nodes. Use lucide-react icons."
            exit 1
          fi

      # R7: Ban ToolLoopAgent (server never runs agent loops)
      - name: R7 Ban ToolLoopAgent in hub
        run: |
          ! grep -rn 'ToolLoopAgent' services/hub/ --include='*.ts'

      # R10: Hub must not import encrypt/decrypt from packages/crypto
      - name: R10 Hub cannot import crypto encrypt/decrypt
        run: |
          ! grep -rn "from.*@firefly-mesh/crypto" \
            services/hub/ --include='*.ts' \
            | grep -E "(encrypt|decrypt)"

      # R11: Ban P2P/mesh VPN libraries
      - name: R11 Ban P2P/VPN libraries
        run: |
          ! grep -rn -E '"(tailscale|wireguard|wgctrl|simple-peer|@webrtc|webrtc)"' \
            services/ packages/ \
            --include='package.json' \
            | grep -v legacy/

      # R12: verifySignature must be called before any message processing in hub
      - name: R12 ed25519 verifySignature present in hub message handlers
        run: |
          if find services/hub/src -name '*.ts' -exec grep -l 'sendMessage\|handleMessage\|processMessage' {} \; 2>/dev/null | head -1 | grep -q .; then
            ! find services/hub/src -name '*.ts' -exec grep -l 'sendMessage\|handleMessage\|processMessage' {} \; 2>/dev/null \
              | xargs grep -L 'verifySignature' 2>/dev/null \
              | grep -v '\.test\.'
          fi

      # R15: Ban AWS/GCP/Azure SDKs in services/ (Cloudflare-only production)
      - name: R15 Ban non-Cloudflare cloud SDKs in services/
        run: |
          ! grep -rn -E '"(@aws-sdk|@google-cloud|@azure)"' \
            services/ --include='package.json' \
            | grep -v 'hub-selfhost'

      # R16: Ban UPDATE/DELETE on audit_log everywhere EXCEPT lines that
      # carry the explicit `cron.truncate(audit_log)` marker comment.
      #
      # Whitelist evolution:
      #   v1 (original): `cron.*truncate` — too loose; any symbol containing
      #     both words bypassed (Schneier P0-4 finding).
      #   v2 (path-based): `^services/hub/src/cron/cleanup.ts:` — better but
      #     still allows any NEW destructive line inside that file to slip in
      #     unreviewed (discriminator follow-up).
      #   v3 (this): exact inline marker `cron.truncate(audit_log)` REQUIRED
      #     on the offending line. Any code adding UPDATE/DELETE on audit_log
      #     anywhere — including future additions inside cleanup.ts — must
      #     declare itself with the marker, forcing reviewer awareness.
      - name: R16 audit_log append-only (no UPDATE/DELETE)
        run: |
          ! grep -rn -E '(update|delete).*audit_log' \
            services/hub/ --include='*.ts' -i \
            | grep -v -E '(\.test\.|cron\.truncate\(audit_log\))'
