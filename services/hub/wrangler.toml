name = "firefly-mesh-hub"
main = "src/index.ts"
compatibility_date = "2025-05-09"
compatibility_flags = ["nodejs_compat"]

# Production hardening — disable the auto-generated workers.dev URL and
# per-version preview URLs. The hub is only reachable via the custom domain
# hub.firefly-mesh.com (configured in the Cloudflare dashboard).
# Rationale:
#   - workers.dev opens a second public attack surface
#   - Better Auth's trustedOrigins is keyed on hub.firefly-mesh.com, so any
#     request hitting workers.dev gets CSRF-rejected anyway
#   - Preview URLs leak per-version snapshots publicly with no value in prod
workers_dev = false
preview_urls = false

[vars]
APP_URL = "https://hub.firefly-mesh.com"
PWA_URL = "https://firefly-mesh.com"
RESEND_FROM_EMAIL = "no-reply@firefly-mesh.com"
# Round-3 security H2 fix — shared secret asserted on TENANT_HUB DO internal
# RPC path. This placeholder is for local dev only; production MUST override
# via `wrangler secret put INTERNAL_SECRET`. The placeholder is intentionally
# committed (vs put in .dev.vars) because wrangler dev's secret loading for
# new keys was observed to not propagate to all isolates without a clean
# restart, while [vars] always reaches both Worker and DO.
INTERNAL_SECRET = "local-dev-placeholder-do-internal-rpc-override-via-wrangler-secret-in-prod"

[[d1_databases]]
binding = "DB"
database_name = "firefly-mesh-hub-db"
database_id = "522b31e6-7693-4cbf-a784-e5d86f9bf51c"

[[durable_objects.bindings]]
name = "TENANT_HUB"
class_name = "TenantHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantHub"]

[triggers]
# Scheduled cleanup tasks — see services/hub/src/cron/cleanup.ts
crons = [
  "0 * * * *",  # hourly: drain expired pending_messages
  "0 3 * * *",  # daily 03:00 UTC: truncate audit_log to last 90 days
]

# Rate limiting bindings (P0-6 — Schneier critical).
# CF Workers stable rate-limit API — namespace_id is per-account; periods
# must be 10 or 60 seconds.
#
# RL_AUTH    : credential stuffing on /api/auth/sign-up + /api/auth/sign-in/*
# RL_PAIR    : pairing code enumeration on /api/agents/pair-init + pair-status
# RL_MESSAGE : message spam / write DoS on /api/messages + /api/a2a/message

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 10

[[ratelimits]]
name = "RL_PAIR"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_MESSAGE"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 60
  period = 60

# RL_A2A is intentionally a separate binding from RL_MESSAGE: the two endpoints
# have different keying semantics (RL_MESSAGE keys per authenticated agent,
# RL_A2A keys per source IP because A2A is unauthenticated until step 3 sig
# verify). A single partner server fanning out for multiple agents needs more
# headroom than a single agent's own quota.
[[ratelimits]]
name = "RL_A2A"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 120
  period = 60

# Secrets — set via: wrangler secret put <NAME>
# BETTER_AUTH_SECRET   (random 32-byte string, e.g. openssl rand -hex 32)
# GOOGLE_CLIENT_ID     (Google OAuth app)
# GOOGLE_CLIENT_SECRET
# GITHUB_CLIENT_ID     (GitHub OAuth app)
# GITHUB_CLIENT_SECRET
# RESEND_API_KEY       (Resend dashboard → API keys)
# JWT_SECRET           (random 32-byte string for Agent JWT)
