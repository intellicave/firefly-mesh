packages:
  # packages/web is intentionally excluded — it holds the scene/* code only
  # (the rest moved to legacy/v0/packages/web/) and is awaiting rescue into a
  # dedicated package; it has no package.json yet.
  - "packages/client"
  - "packages/crypto"
  - "packages/proto"
  - "packages/shared"
  - "services/hub"
  # Sprint B B.5 (done): services/pwa dropped — Option B has services/web
  # serve both marketing landing (`/`) and the full dashboard. The Astro
  # pwa's content was a sprint A stopgap; the marketing copy + i18n
  # strings were ported into services/web before deletion.
  #
  # Sprint B B.3.f (option B chosen): services/web removed from workspace.
  # Reason: @opennextjs/cloudflare 1.19 + pnpm workspace child triggers a
  # path-mangling bug — the bundle ends up at
  # `.open-next/server-functions/default/services/web/.next/...` but the
  # Workers runtime resolver looks for `/.next/...` (no subpath), causing
  # "Dynamic require of /.next/server/middleware-manifest.json is not
  # supported" on every prod request. Treating services/web as its own
  # standalone project with its own lockfile + node_modules sidesteps the
  # workspace-root detection. services/web no longer shares any
  # workspace deps after B.1 (no @firefly-mesh/core), so going standalone
  # is a no-op for dependency resolution.
  # Sprint B B.1 (done): legacy/v0/packages/core dropped — v0 server routes
  # that imported it are deleted, services/web no longer needs the dep.
  - "scripts/scene"
